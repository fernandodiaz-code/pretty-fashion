{% extends 'base.html' %}

{% block title %}Agregar artículos al inventario{% endblock %}

{% block content %}
<div class="container">
    <h2 class="text-white text-center mb-4">Agregar artículos al inventario</h2>

    <div class="bg-purple p-4 rounded" style="max-width: 700px; margin: auto;">
        <form method="POST" autocomplete="off">
            {% csrf_token %}

            <div id="inputs">
                <div class="row g-2 align-items-center mb-3">
                    <div class="col-8">
                        <input type="text" name="codigos[]" class="form-control" placeholder="Código de barra" autocomplete="off" onkeydown="checkEnter(event)">
                    </div>
                    <div class="col-4">
                        <input type="number" name="cantidades[]" class="form-control" placeholder="Cantidad" autocomplete="off">
                    </div>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-warning fw-bold">Actualizar inventario</button>
            </div>
        </form>
    </div>
</div>

<script>
function checkEnter(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        agregarFila();
    }
}

function agregarFila() {
    const inputsDiv = document.getElementById("inputs");

    const fila = document.createElement("div");
    fila.className = "row g-2 align-items-center mb-3";

    const colCodigo = document.createElement("div");
    colCodigo.className = "col-8";
    const inputCodigo = document.createElement("input");
    inputCodigo.type = "text";
    inputCodigo.name = "codigos[]";
    inputCodigo.placeholder = "Código de barra";
    inputCodigo.className = "form-control";
    inputCodigo.autocomplete = "off";
    inputCodigo.onkeydown = checkEnter;

    const colCantidad = document.createElement("div");
    colCantidad.className = "col-4";
    const inputCantidad = document.createElement("input");
    inputCantidad.type = "number";
    inputCantidad.name = "cantidades[]";
    inputCantidad.placeholder = "Cantidad";
    inputCantidad.className = "form-control";
    inputCantidad.autocomplete = "off";

    colCodigo.appendChild(inputCodigo);
    colCantidad.appendChild(inputCantidad);
    fila.appendChild(colCodigo);
    fila.appendChild(colCantidad);

    inputsDiv.appendChild(fila);
}
</script>
{% endblock %}
