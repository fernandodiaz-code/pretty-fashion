{% extends "base.html" %}

{% block title %}Informes{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="text-white">Generar Informes</h1>
</div>

<div class="d-flex justify-content-center mt-4 gap-4">

    <!-- Botón: Informe de Ventas -->
    <div style="background-color: #4B0082; padding: 30px; border-radius: 10px;">
        <h5 class="text-white text-center mb-3">Ventas por Fecha</h5>
        <div class="text-center">
            <a href="{% url 'informe_ventas' %}" class="btn fw-bold" style="background-color: #FFA500; color: black;">
                Ver Informe
            </a>
        </div>
    </div>

    <!-- Botón: Informe de Notas de Crédito -->
    <div style="background-color: #4B0082; padding: 30px; border-radius: 10px;">
        <h5 class="text-white text-center mb-3">Notas de Crédito Emitidas</h5>
        <div class="text-center">
            <a href="{% url 'informe_notas_credito' %}" class="btn fw-bold" style="background-color: #FFA500; color: black;">
                Ver Informe
            </a>
        </div>
    </div>

</div>
{% endblock %}
