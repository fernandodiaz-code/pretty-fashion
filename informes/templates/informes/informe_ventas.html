{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h1 class="text-white text-3xl font-bold mb-6">Informe Total de Ventas</h1>

  <form method="POST" class="space-y-4">
    {% csrf_token %}

    <div>
      <label class="text-white block mb-1">Desde:</label>
      <input type="date" name="fecha_inicio" required class="rounded px-3 py-2 w-full">
    </div>

    <div>
      <label class="text-white block mb-1">Hasta:</label>
      <input type="date" name="fecha_fin" required class="rounded px-3 py-2 w-full">
    </div>

    <div class="mt-4">
      <button type="submit" class="bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-2 px-4 rounded">
        Buscar
      </button>
    </div>
  </form>

  {% if total is not None %}
    <div class="mt-8 bg-white rounded p-4 shadow-md">
      <h2 class="text-xl font-bold text-black mb-4">Total de ventas en el período:</h2>
      <p class="text-2xl font-bold text-black">${{ total|floatformat:0 }}</p>
    </div>
  {% endif %}
</div>
{% endblock %}
