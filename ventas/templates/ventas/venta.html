{% extends "base.html" %}

{% block title %}Formulario de Venta{% endblock %}

{% block content %}
<h2 class="text-white mb-4">Formulario de Venta</h2>

<form method="POST" autocomplete="off" class="text-white">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">ID Vendedor:</label>
        <input type="text" class="form-control" name="id_vendedor" maxlength="3" style="max-width: 100px;" required>
    </div>

    <div class="mb-3">
        <label class="form-label">RUT Cliente:</label>
        <input type="text" class="form-control" name="rut_cliente" maxlength="12" style="max-width: 200px;" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Códigos de barra (uno por línea):</label>
        <textarea class="form-control" name="codigos_barra" rows="4" required></textarea>
    </div>

    <div class="mb-3">
        <h5 id="total_venta">💵 Total: $0</h5>
    </div>

    <div class="mb-3">
        <label class="form-label">Método de Pago:</label><br>
        <button type="button" class="btn btn-warning me-2 fw-bold" onclick="selectMetodo('debito')">Débito</button>
        <button type="button" class="btn btn-warning me-2 fw-bold" onclick="selectMetodo('credito')">Crédito</button>
        <button type="button" class="btn btn-warning fw-bold" onclick="selectMetodo('efectivo')">Efectivo</button>
        <input type="hidden" id="metodo_pago" name="metodo_pago" value="debito">
    </div>

    <div class="mb-3" id="campo_operacion" style="display: none;">
        <label class="form-label">Número de operación:</label>
        <input type="text" class="form-control" name="numero_operacion">
    </div>

    <div class="mb-3" id="campo_efectivo" style="display: none;">
        <label class="form-label">Monto recibido:</label>
        <input type="number" class="form-control" name="monto_efectivo">
        <p id="vuelto" class="mt-2 fw-semibold"></p>
    </div>

    <button type="submit" class="btn btn-warning mt-3 fw-bold">Confirmar Venta e Imprimir</button>
</form>

<script>
    function selectMetodo(metodo) {
        document.getElementById("metodo_pago").value = metodo;
        document.getElementById("campo_operacion").style.display = (metodo === "debito" || metodo === "credito") ? "block" : "none";
        document.getElementById("campo_efectivo").style.display = (metodo === "efectivo") ? "block" : "none";
    }

    function calcularTotalVenta() {
        const codigos = document.querySelector("[name='codigos_barra']").value;
        const csrf = document.querySelector("[name='csrfmiddlewaretoken']").value;

        fetch("{% url 'calcular_total_ajax' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": csrf
            },
            body: new URLSearchParams({ codigos })
        })
        .then(res => res.json())
        .then(data => {
            if (data.total >= 0) {
                document.getElementById("total_venta").textContent = `💵 Total: $${data.total}`;
            } else {
                document.getElementById("total_venta").textContent = "❌ Error al calcular total";
            }
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelector("[name='codigos_barra']").addEventListener("input", calcularTotalVenta);
    });
</script>
{% endblock %}
