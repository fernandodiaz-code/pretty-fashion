{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h2 class="text-white text-3xl font-bold mb-6">Modificar Inventario por Robo</h2>

  <form method="post" class="bg-orange-500 p-6 rounded-lg shadow-md w-full max-w-md">
    {% csrf_token %}

    <div class="mb-6">
      <label for="codigo_barra" class="block text-white font-semibold mb-2">Código de barra:</label>
      <input type="text" name="codigo_barra" id="codigo_barra" class="w-full p-2 rounded-lg border border-gray-300">
    </div>

    <div class="mb-6">
      <label for="cantidad" class="block text-white font-semibold mb-2">Cantidad a descontar:</label>
      <input type="number" name="cantidad" id="cantidad" class="w-full p-2 rounded-lg border border-gray-300">
    </div>

    <div class="mb-4">
      <button type="submit" class="bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-2 px-4 rounded-lg transition duration-200">
        Actualizar
      </button>
    </div>

    {% if mensaje %}
      <div class="bg-white text-black px-4 py-2 rounded border border-gray-300 mt-4">
        {{ mensaje }}
      </div>
    {% endif %}
  </form>
</div>
{% endblock %}
