{% extends 'base.html' %}
{% block title %}Nota de Crédito{% endblock %}
{% block content %}
    <h2>Emitir Nota de Crédito</h2>

    {% if mensaje %}
        <div class="alert alert-success">{{ mensaje }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="numero_boleta" class="form-label">Número de boleta</label>
            <input type="text" class="form-control" id="numero_boleta" name="numero_boleta" required>
        </div>
        <div class="mb-3">
            <label for="motivo" class="form-label">Motivo</label>
            <textarea class="form-control" id="motivo" name="motivo" required></textarea>
        </div>
        <button type="submit" class="btn btn-light">Emitir Nota de Crédito</button>
    </form>
{% endblock %}
