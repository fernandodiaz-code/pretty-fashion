{% extends "base.html" %}

{% block title %}Administración{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="text-white">Administración</h1>
</div>

<div class="d-flex justify-content-center mt-4 flex-wrap gap-4">

    <!-- Bloque: Emitir Nota de Crédito -->
    <div style="background-color: #4B0082; padding: 30px; border-radius: 10px;">
        <h5 class="text-white text-center mb-3">Emitir Nota de Crédito</h5>
        <div class="text-center">
            <a href="{% url 'nota_credito' %}" class="btn fw-bold" style="background-color: #FFA500; color: black;">
                Ingresar
            </a>
        </div>
    </div>

    <!-- Bloque: Añadir Vendedor -->
    <div style="background-color: #4B0082; padding: 30px; border-radius: 10px;">
        <h5 class="text-white text-center mb-3">Añadir Vendedor</h5>
        <div class="text-center">
            <a href="{% url 'agregar_vendedor' %}" class="btn fw-bold" style="background-color: #FFA500; color: black;">
                Ingresar
            </a>
        </div>
    </div>

    <!-- Bloque: Eliminar Vendedor -->
    <div style="background-color: #4B0082; padding: 30px; border-radius: 10px;">
        <h5 class="text-white text-center mb-3">Eliminar Vendedor</h5>
        <div class="text-center">
            <a href="{% url 'gestion_vendedores_admin' %}" class="btn fw-bold" style="background-color: #FFA500; color: black;">
                Ingresar
            </a>
        </div>
    </div>

    <!-- Bloque: Modificar Inventario por Robo -->
    <div style="background-color: #4B0082; padding: 30px; border-radius: 10px;">
        <h5 class="text-white text-center mb-3">Modificar Inventario por Robo</h5>
        <div class="text-center">
            <a href="{% url 'modificar_inventario_robo' %}" class="btn fw-bold" style="background-color: #FFA500; color: black;">
                Ingresar
            </a>
        </div>
    </div>

    

</div>
{% endblock %}
