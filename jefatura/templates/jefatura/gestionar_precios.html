{% extends "base.html" %}
{% block title %}Precios de Gas{% endblock %}
{% block content %}
<div class="container">
    <h1 class="page-title"><i class="fas fa-tags me-2"></i>Precios de Gas</h1>

    <div class="card card-dashboard">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Stock lleno</th>
                                <th>Precio de venta</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for g in galones %}
                            <tr>
                                <td><strong>Gas {{ g.peso }} kg</strong></td>
                                <td><span class="badge bg-success badge-stock">{{ g.llenos }}</span></td>
                                <td style="max-width: 240px;">
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input
                                            type="number"
                                            name="precio_{{ g.id }}"
                                            class="form-control"
                                            min="0"
                                            step="1"
                                            value="{{ g.precio }}"
                                            required
                                        >
                                    </div>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="3" class="text-center text-muted">Sin galones registrados.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-floppy-disk me-2"></i>Guardar precios
                    </button>
                    <a href="{% url 'menu_jefatura' %}" class="btn btn-outline-secondary">Volver</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
