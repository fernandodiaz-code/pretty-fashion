{% extends 'base.html' %}
{% block content %}

<a href="{% url 'agregar_vendedor' %}" class="boton">Agregar Vendedor</a>
<ul>
  {% for vendedor in vendedores %}

      {{ vendedor.1 }}
      <a href="{% url 'eliminar_vendedor' vendedor.0 %}">Eliminar</a>
    </li>
  {% endfor %}
</ul>
{% endblock %}
