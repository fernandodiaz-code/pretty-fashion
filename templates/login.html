<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gas Orteguita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2540 0%, #1a3c5e 60%, #2a5a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 18px;
            padding: 44px 40px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.35);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo .flame-icon {
            font-size: 3.2rem;
            color: #f97316;
            display: block;
            margin-bottom: 10px;
        }
        .login-logo h2 {
            color: #1a3c5e;
            font-weight: 700;
            font-size: 1.6rem;
            margin: 0 0 4px;
        }
        .login-logo p {
            color: #6c757d;
            font-size: 0.88rem;
            margin: 0;
        }
        .form-label {
            font-weight: 600;
            color: #374151;
            font-size: 0.88rem;
            margin-bottom: 6px;
        }
        .form-control {
            border-radius: 9px;
            padding: 11px 14px;
            border: 1.5px solid #d1d5db;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #1a3c5e;
            box-shadow: 0 0 0 3px rgba(26,60,94,0.12);
        }
        .input-icon {
            position: relative;
        }
        .input-icon i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .input-icon .form-control {
            padding-left: 36px;
        }
        .btn-login {
            background: #1a3c5e;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 9px;
            font-weight: 600;
            width: 100%;
            font-size: 0.98rem;
            transition: background 0.2s;
            cursor: pointer;
        }
        .btn-login:hover {
            background: #2a5a8a;
        }
        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 9px;
            padding: 10px 14px;
            color: #dc2626;
            font-size: 0.85rem;
            margin-bottom: 18px;
        }
        .divider {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 28px 0 0;
        }
        .footer-note {
            text-align: center;
            margin-top: 16px;
            color: #9ca3af;
            font-size: 0.78rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <i class="fas fa-fire-flame-curved flame-icon"></i>
            <h2>Gas Orteguita</h2>
            <p>Sistema de Gestión</p>
        </div>

        {% if form.errors %}
        <div class="error-msg">
            <i class="fas fa-circle-xmark me-1"></i> Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" autofocus required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-right-to-bracket me-2"></i>Iniciar Sesión
            </button>
        </form>

        <hr class="divider">
        <p class="footer-note">Isla Decepción 204, Lo Prado · Santiago</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
