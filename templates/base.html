<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Pretty Fashion{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            width: 250px;
            background-color: #4B0082;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            margin: 15px 0;
            font-weight: bold;
        }
        .sidebar a:hover {
            text-decoration: underline;
        }
        .content {
            flex-grow: 1;
            background-color: #FF6600;
            padding: 30px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Pretty Fashion</h2>
        <a href="/ventas/venta/">🛒 Gestión de Ventas</a>
        <a href="{% url 'consultar_boletas' %}">🧑‍🤝‍🧑 Gestión de Clientes</a>
        <a href="/inventario/menu/">📦 Gestión Inventario</a>
        <a href="/vendedores/menu/">🧍‍♂️ Gestión Vendedores</a>
        <a href="/informes/menu/">📑 Generar Informe</a>
        <a href="/jefatura/">⚙️ Administrador</a>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
